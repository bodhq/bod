# Školní instalace používá hotové obrazy. Přístup zvenčí vede přes Caddy.
name: ${BOD_PROJECT:?Run python3 bod.py install first}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${BOD_BIND:-0.0.0.0}:${BOD_HTTP_PORT:-80}:80"
      - "${BOD_BIND:-0.0.0.0}:${BOD_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *default-logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  api:
    image: ${API_IMAGE:?Missing API_IMAGE in images.env}
    restart: unless-stopped
    command: ["uvicorn", "server.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL using db:5432}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to the public HTTPS origin}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DEBUG: "false"
      MEDIA_ROOT: /var/lib/bod/media
    volumes:
      - school-media:/var/lib/bod/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  web:
    image: ${WEB_IMAGE:?Missing WEB_IMAGE in images.env}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

volumes:
  school-media:
  postgres-data:
  caddy-data:
  caddy-config:
