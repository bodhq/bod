# Shell runner: Linux, Node from .nvmrc, Corepack, uv and access to Docker.
# Both providers execute the same scripts; image publication is owned by GitHub.
default:
  tags: [bod-linux]
stages: [check, production]
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
check:
  stage: check
  timeout: 30m
  script:
    - scripts/ci install
    - scripts/ci check
integration:
  stage: check
  timeout: 15m
  script:
    - uv sync --all-packages --all-groups --frozen
    - scripts/ci integration
production:
  stage: production
  timeout: 30m
  script:
    - scripts/ci production
