version: 2
updates:
  # Aktualizace NPM závislostí (přes pnpm workspaces v kořeni repozitáře)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
    labels:
      - "deps"

  # Python workspace a uv.lock jsou v kořeni repozitáře.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "deps"

  # Aktualizace verzí samotných Github Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "deps"
