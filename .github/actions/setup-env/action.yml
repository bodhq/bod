name: Setup environment
description: Install Node.js, pnpm, Python and locked dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - uses: astral-sh/setup-uv@v5
      with:
        version: "0.11.0"
        python-version: "3.12"
        enable-cache: true
    - run: scripts/ci install
      shell: bash
