name: School release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: school-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  draft:
    name: Prepare tested release for publication
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BOD_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: school-deployment
          path: ${{ runner.temp }}/bod-dist
      - name: Check version and select only installation assets
        id: release
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path("infra/release.json").read_text())["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", version) or os.environ["BOD_TAG"] != "v" + version:
              raise SystemExit("Tag must match infra/release.json")
          filename = "bod-" + version + "-linux-amd64"
          folder = Path(os.environ["RUNNER_TEMP"]) / "bod-dist"
          for suffix in (".tar.gz", ".sha256"):
              if not (folder / (filename + suffix)).is_file():
                  raise SystemExit("Missing tested installation asset")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("filename=" + filename + "\n")
          PY
      - name: Create draft with installation bundle and checksum
        env:
          BOD_FILENAME: ${{ steps.release.outputs.filename }}
        run: |
          gh release create "$BOD_TAG" \
            "$RUNNER_TEMP/bod-dist/$BOD_FILENAME.tar.gz" \
            "$RUNNER_TEMP/bod-dist/$BOD_FILENAME.sha256" \
            --draft --verify-tag --generate-notes --title "bod $BOD_TAG"
