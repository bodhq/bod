name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Verify OpenAPI Sync
        run: |
          pnpm api:openapi
          if ! git diff --exit-code docs/openapi.json; then
            echo "::error::OpenAPI schema docs/openapi.json je neaktuální!"
            exit 1
          fi

      - name: Generate API Client
        run: pnpm gen:api

      - name: Install Playwright Browsers
        run: pnpm --filter @bod/e2e exec playwright install --with-deps

      - name: Lint Codebase
        run: pnpm exec turbo run lint

      - name: Typecheck
        run: pnpm exec turbo run typecheck

      - name: Run Unit & E2E Tests
        run: pnpm exec turbo run test

      - name: Build Applications
        run: pnpm exec turbo run build
