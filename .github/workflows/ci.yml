name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Verify Dependency Compatibility
        run: pnpm deps:check

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level=high

      - name: Verify deployment tooling
        run: pnpm infra:check

      - name: Verify OpenAPI Sync
        run: |
          pnpm api:openapi
          if ! git diff --exit-code apps/api/schema/openapi.json; then
            echo "::error::OpenAPI snapshot je neaktuální!"
            exit 1
          fi

      - name: Generate API Client
        run: pnpm gen:client

      - name: Install Playwright Browsers
        run: pnpm --filter @bod/e2e exec playwright install --with-deps chromium

      - name: Lint Codebase
        run: pnpm exec turbo run lint

      - name: Typecheck
        run: pnpm exec turbo run typecheck

      - name: Run Unit & E2E Tests
        run: pnpm exec turbo run test

      - name: Build Applications
        run: pnpm exec turbo run build

  backend-integration:
    name: PostgreSQL and Redis integration
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bod
          POSTGRES_PASSWORD: bod
          POSTGRES_DB: bod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bod -d bod_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: sqlite://
      TEST_POSTGRES_URL: postgresql+psycopg://bod:bod@localhost:5432/bod_test
      TEST_REDIS_URL: redis://localhost:6379/0
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.0"
      - run: uv sync --all-packages --all-groups --frozen
      - run: uv run pytest -m "postgres or redis" --no-cov

  production:
    name: Production images and school deployment
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: bod-ci-production
      COMPOSE_FILE: infra/docker-compose.yml:infra/docker-compose.verify.yml
      DOMAIN: localhost
      POSTGRES_USER: bod_verify
      POSTGRES_PASSWORD: ci-isolated-not-for-deployment
      POSTGRES_DB: bod_verify
      DOCKER_DATABASE_URL: postgresql://bod_verify:ci-isolated-not-for-deployment@db:5432/bod_verify
      ALLOWED_ORIGINS: '["https://localhost:18443"]'
    steps:
      - uses: actions/checkout@v7
      - name: Build and start production services
        run: |
          docker compose pull db redis caddy
          docker compose build --pull
          docker compose up -d --wait --wait-timeout 180
      - name: Verify HTTPS, database, API routing and static assets
        run: |
          curl --fail --silent --insecure https://localhost:18443/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          test "$(curl --silent --insecure -o /dev/null -w '%{http_code}' https://localhost:18443/api/v1/auth/me)" = "401"
          curl --fail --silent --insecure https://localhost:18443/login -o /tmp/login.html
          python3 -c 'import re; from pathlib import Path; assets = set(re.findall(r"(?:src|href)=\"(/_next/static/[^\"]+)\"", Path("/tmp/login.html").read_text())); assert assets; Path("/tmp/assets.txt").write_text("\n".join(assets))'
          while IFS= read -r asset || [ -n "$asset" ]; do
            curl --fail --silent --insecure "https://localhost:18443$asset" -o /dev/null
          done < /tmp/assets.txt
      - name: Verify authenticated SSR with a disposable administrator
        run: |
          umask 077
          docker compose exec -T api python -m server.scripts.bootstrap_admin > /tmp/production-bootstrap.txt
          python3 - <<'PYAUTH'
          import http.cookiejar, json, secrets, ssl, urllib.request
          from pathlib import Path
          origin = "https://localhost:18443"
          password = next(line.split(": ", 1)[1] for line in Path("/tmp/production-bootstrap.txt").read_text().splitlines() if line.startswith("Dočasné heslo: "))
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar), urllib.request.HTTPSHandler(context=ssl._create_unverified_context()))
          def call(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(origin + path, data=data, headers={"Origin": origin, "Content-Type": "application/json", "X-Requested-With": "bod"})
              response = opener.open(req, timeout=10)
              assert response.status == 200 and response.url == origin + path, (path, response.status, response.url)
              return response.read()
          call("/api/v1/auth/login", {"username": "root", "password": password})
          assert any(cookie.secure for cookie in jar)
          call("/api/v1/auth/change-password", {"current_password": password, "new_password": secrets.token_urlsafe(24)})
          call("/api/v1/auth/me")
          call("/api/v1/admin/users")
          call("/app")
          print("Secure login, password change and authenticated SSR passed")
          PYAUTH
          rm /tmp/production-bootstrap.txt
      - name: Package the exact tested images
        run: |
          python3 scripts/package_release.py --output "$RUNNER_TEMP/bod-dist" --api-image bod-ci-production-api --web-image bod-ci-production-web
      - name: Install, upgrade and restore on the disposable Linux VM
        run: |
          bundle=$(python3 -c 'import glob,os; paths=glob.glob(os.environ["RUNNER_TEMP"]+"/bod-dist/bod-*-linux-*.tar.gz"); assert len(paths)==1; print(paths[0])')
          sudo python3 tests/infra/acceptance.py --bundle "$bundle" --root "$RUNNER_TEMP/bod-school" --output "$RUNNER_TEMP/bod-acceptance" --cleanup
          sudo install -m 600 -o "$(id -u)" -g "$(id -g)" "$RUNNER_TEMP/bod-acceptance/recovery.tar.gz" "$RUNNER_TEMP/bod-dist/recovery.tar.gz"
          sudo install -m 600 -o "$(id -u)" -g "$(id -g)" "$RUNNER_TEMP/bod-acceptance/fixture.json" "$RUNNER_TEMP/bod-dist/fixture.json"
      - name: Keep tested bundle and disposable recovery fixture
        uses: actions/upload-artifact@v7
        with:
          name: school-deployment
          path: ${{ runner.temp }}/bod-dist/
          retention-days: 1
          if-no-files-found: error
      - name: Service status and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
      - name: Remove isolated services and test data
        if: always()
        run: docker compose down --volumes --remove-orphans

  school-recovery:
    name: Recover school on another clean Linux VM
    timeout-minutes: 15
    needs: production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: school-deployment
          path: ${{ runner.temp }}/bod-dist
      - name: Restore into an empty installation
        run: |
          bundle=$(python3 -c 'import glob,os; paths=glob.glob(os.environ["RUNNER_TEMP"]+"/bod-dist/bod-*-linux-*.tar.gz"); assert len(paths)==1; print(paths[0])')
          sudo python3 tests/infra/acceptance.py --phase fresh --bundle "$bundle" --archive "$RUNNER_TEMP/bod-dist/recovery.tar.gz" --fixture "$RUNNER_TEMP/bod-dist/fixture.json" --root "$RUNNER_TEMP/bod-recovered" --output "$RUNNER_TEMP/bod-recovery-test" --cleanup
