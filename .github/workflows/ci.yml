name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Verify OpenAPI Sync
        run: |
          pnpm api:openapi
          if ! git diff --exit-code docs/openapi.json; then
            echo "::error::OpenAPI schema docs/openapi.json je neaktuální!"
            echo "::error::Změnil/a jsi backend kód, ale nevygeneroval/a nový schema. Spusť lokálně 'pnpm api:openapi' a commitni docs/openapi.json."
            exit 1
          fi

      - name: Generate API Client
        run: pnpm gen:api

      - name: Quality Assurance (Lint, Types, Build)
        run: pnpm exec turbo run lint typecheck build
