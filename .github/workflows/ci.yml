name: CI
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
      - run: scripts/ci check
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.0"
      - run: uv sync --all-packages --all-groups --frozen
      - run: scripts/ci integration
  production:
    needs: [check, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.0"
      - run: scripts/ci production
      - run: scripts/ci publish
        if: github.event_name == 'push' && github.ref_name == (vars.DEPLOY_BRANCH || 'develop')
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, integration, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      BOD_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.0"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/ci production
      - run: scripts/ci release
      - run: gh release create "$BOD_TAG" dist/*.tar.gz dist/*.sha256 --draft --verify-tag --generate-notes
