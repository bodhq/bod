name: CI
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  metadata:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci metadata
        env:
          BOD_BRANCH: ${{ github.head_ref }}
          BOD_TITLE: ${{ github.event.pull_request.title }}
  check:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
      - run: scripts/ci check
  integration:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.0"
          python-version: "3.12"
      - run: scripts/ci integration
  production:
    needs: [check, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      BOD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.0"
          python-version: "3.12"
      - run: scripts/ci production
      - run: scripts/ci package
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: deployment-${{ github.sha }}
          path: |
            dist/bod-*.tar.gz
            dist/bod-*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/ci publish
        if: github.event_name == 'push'
      - run: scripts/ci release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
