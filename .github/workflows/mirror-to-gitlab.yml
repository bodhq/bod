name: Mirror to GitLab
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: gitlab-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/ci mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
