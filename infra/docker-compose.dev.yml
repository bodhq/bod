services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bod
      POSTGRES_PASSWORD: bod
      POSTGRES_DB: bod
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bod -d bod"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

volumes:
  postgres-dev-data:
