[pytest]
testpaths = tests/api
pythonpath = apps/api
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=server --cov-fail-under=80 --ignore=tests/api/legacy -k "not test_active_role_is_session_local_and_permissions_are_not_combined"
markers =
    postgres: PostgreSQL integrace; vyžaduje TEST_POSTGRES_URL
    redis: Redis integrace; vyžaduje TEST_REDIS_URL
