[pytest]
testpaths = tests/api
pythonpath = apps/api
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=server --cov-fail-under=80
markers =
    postgres: volitelné testy PostgreSQL migrací; vyžadují TEST_POSTGRES_URL
